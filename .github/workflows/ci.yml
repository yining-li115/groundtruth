name: CI

# Quality gate: typecheck, deterministic interaction safety checks, content validation and both
# front-end builds on every push and PR. Render deploys separately (render.yaml); this catches
# breakage early and independently of deploy.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Validate content JSON
        run: npm run check:content

      - name: Check gesture recognition and calibration
        run: npm run check:pointer

      - name: Check exclusive interaction routing
        run: npm run check:interaction

      - name: Check scene navigation and tour takeover
        run: npm run check:scene

      - name: Build controller
        run: npm run build -w @groundtruth/controller

      - name: Build kiosk
        run: npm run build -w @groundtruth/kiosk
